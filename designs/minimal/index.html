<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Minimal redesigns</title>
<style>
  body { font-family: system-ui, sans-serif; background: #f2f3f5; color: #1a1d24; margin: 0; padding: 64px 16px; line-height: 1.5; }
  main { max-width: 640px; margin: 0 auto; }
  h1 { font-size: 2rem; margin: 0 0 32px; }
  ol { list-style: none; padding: 0; margin: 0; display: grid; gap: 12px; }
  a { display: block; background: #fff; border-radius: 14px; padding: 18px 22px; text-decoration: none; color: inherit; border: 1px solid #e3e5ea; }
  a:hover, a:focus-visible { border-color: #1a1d24; }
  span { display: block; color: #5b6170; }
</style>
</head>
<body>
<main>
  <h1>Three minimal designs</h1>
  <ol>
    <li><a href="1-drift/"><strong>Drift</strong><span>Giant type, a photo that opens inside your name, skills that slide as you scroll.</span></a></li>
    <li><a href="2-field/"><strong>Field</strong><span>A dot grid that reacts to your cursor and ripples when you click.</span></a></li>
    <li><a href="3-orbit/"><strong>Orbit</strong><span>One screen. Each tab turns the ring around your portrait.</span></a></li>
  </ol>
</main>
</body>
</html>
